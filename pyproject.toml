[tool.poetry]
name = "extended_lengyel"
version = "1.0.0"
description = "Extended Lengyel model for plasma edge modeling."
authors = ["Commonwealth Fusion Systems"]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.poetry.scripts]
xlengyel = 'extended_lengyel.cli:run_extended_lengyel_cli'

[tool.poetry.dependencies]
python = ">=3.12"

# Core CFS Physics Libraries
radas = "^1!1.0.0"
cfspopcon = "^8.0.0"

# Data Science Stack (Synchronized with radas/cfspopcon)
numpy = "^2.5.5"
scipy = "^1.18.1"
matplotlib = "^3.11.2"
pandas = "^3.1.1"
xarray = ">=2026.9.0"
pint = "^0.25.3"
pint-xarray = "^0.6.1"
pyyaml = "^6.0.4"
click = "^8.5.1"

[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"
jupyter = "^1.1.1"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
coverage = "^7.17.4"
ruff = "^0.17.6"
ty = "0.0.107"  # pinned: beta, diagnostics change between 0.0.x releases
nbmake = "^1.5"
ipdb = "^0.13.13"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=extended_lengyel --cov-report term-missing --cov-report xml:coverage.xml --verbose -s --nbmake"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "default::FutureWarning",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 140
extend-exclude = ["notebooks"]  # exploratory notebooks are not linted or formatted
force-exclude = true  # also applies to files passed explicitly, e.g. by pre-commit

[tool.ruff.lint]
select = [
    "A", "B", "C4", "C901", "D", "E", "ERA", "F", "FLY", 
    "ISC", "PERF", "PIE", "PGH", "PL", "Q", "RUF", "T10", 
    "TCH", "UP", "W"
]
ignore = [
    "E501",    # Line length handled by formatter
    "PLR0913", # Allow more arguments in scientific functions
    "PLR0917", # Same exception for positional arguments (new in ruff 0.17)
    "PLR2004", # Magic values are common in physics constants
    "C408",    # Allow dict() calls
    "ISC001",  # Recommended ignore for ruff formatter
    "I001",    # Explicitly ignored: algorithms must be imported in order
    "B028",    # Warnings do not require stacklevel for this research code
    "PLC0415", # Allow imports not at the top of the file
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]  # test names document the tests

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["extended_lengyel"]
