[tool.poetry]
name = "extended_lengyel"
version = "1.0.0"
description = "Extended Lengyel model for plasma edge modeling."
authors = ["Commonwealth Fusion Systems"]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.poetry.scripts]
xlengyel = 'extended_lengyel.cli:run_extended_lengyel_cli'

[tool.poetry.dependencies]
python = ">=3.12"

# Core CFS Physics Libraries
radas = "^1!1.0.0"
cfspopcon = "^8.0.0"

# Data Science Stack (Synchronized with radas/cfspopcon)
numpy = "^2.4.4"
scipy = "^1.17.1"
matplotlib = "^3.10.8"
pandas = "^3.0.2"
xarray = ">=2026.2.0"
pint = "^0.25.3"
pint-xarray = "^0.6.1"
pyyaml = "^6.0.3"
click = "^8.3.2"

# Development/Notebook Support
ipykernel = "^6.29.5"
jupyter = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.1.0"
coverage = "^7.13.5"
ruff = "^0.11"
nbmake = "^1.5"
ipdb = "^0.13.13"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=extended_lengyel --cov-report term-missing --cov-report xml:coverage.xml --verbose -s --nbmake"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "default::FutureWarning",
    "ignore:numpy.ndarray size changed:RuntimeWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = [
    "A", "B", "C4", "D", "E", "ERA", "F", "FLY", 
    "ISC", "PERF", "PIE", "PGH", "PL", "Q", "RUF", "T10", 
    "TCH", "UP", "W"
]
ignore = [
    "E501",    # Line length handled by formatter
    "PLR0913", # Allow more arguments in scientific functions
    "PLR2004", # Magic values are common in physics constants
    "C408",    # Allow dict() calls
    "ISC001",  # Recommended ignore for ruff formatter
    "I001",    # Explicitly ignored: algorithms must be imported in order
    "B028",    # Warnings do not require stacklevel for this research code
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.pydocstyle]
convention = "google"