    JET_units: ""
    AUG_name: k
    AUG_units: ""

  safety_factor_q95:
    JET_name: q95_jet
    JET_units: ""
    AUG_name: q95_val
    AUG_units: ""

  outer_divertor_power:
    AUG_name: pdiv
    AUG_err: pdiv_err
    AUG_units: MW

  shot_identifier:
    JET_name: shots_jet
    JET_units: null
    AUG_name: shots
    AUG_units: null

