# JET NME21 ['cn_mean_jet', 'cn_mean_err_jet', 'cn_ratio_jet', 'ratio_err_jet', 'intrins_jet', 'psep_jet', 'psep_err_jet', 'nsep_jet', 'bt_jet', 'nsep_err_jet', 'ip_jet', 'am_jet', 'kp_jet', 'shots_jet', 'twn1', 'twn2', 'q95_jet', 'tu_jet']
# AUG NME21 ['regress', 'cn_mean', 'regress_err', 'shots', 'cn_flux', 'cn_flux_err', 'intrins', 'intrins_ext', 'diff', 'diff_ext', 'diff_err', 'diff_err_ext', 'cn_err', 'psep', 'dens', 'pcur', 'bt', 'k', 'aminor', 'pdiv', 'pdiv_err', 'psep_err', 'dens_err', 'q95_val', 'tesep']


NME21:
  JET_ignored: [
    "twn1",
    "twn2",
    "cn_ratio_jet", # wrong size
    "ratio_err_jet", # wrong size
    "intrins_jet" # wrong size
  ]
  AUG_ignored: [
    "diff",
    "diff_err_ext",
    "intrins",
    "intrins_ext",
    "diff_err",
    "diff_ext",
    "cn_flux",
    "cn_flux_err",
    'regress',
    'regress_err',
    "tesep", # single value
  ]

  nitrogen_concentration:
    JET_name: cn_mean_jet
    JET_err: cn_mean_err_jet
